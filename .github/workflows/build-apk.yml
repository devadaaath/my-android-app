name: Build Liquid Glass PDF Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -oq LiquidGlassPDF-Pro-GitHub.zip \
            'app/*' \
            'build.gradle.kts' \
            'gradle.properties' \
            'settings.gradle.kts'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          block = '''
          kotlinOptions {
              jvmTarget = "17"
          }
          '''

          if "kotlinOptions" not in s:
              s = s.replace(
                  '    buildFeatures { compose = true }',
                  '    buildFeatures { compose = true }\\n' + block
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassPDF-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
