name: Build Liquid Glass PDF Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -oq LiquidGlassPDF-Pro-GitHub.zip \
            'app/*' \
            'build.gradle.kts' \
            'gradle.properties' \
            'settings.gradle.kts'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Kotlin JVM target
        run: |
          sed -i '/buildFeatures {/a\    kotlinOptions { jvmTarget = "17" }' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassPDF-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
